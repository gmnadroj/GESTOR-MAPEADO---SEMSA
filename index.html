<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESTOR MAPEADO - SEMSA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#072e50; --navy2:#034b75; --sky:#1da1f2; --sky-d:#1a91da; --sky-soft:#a5d0f5;
  --panel:#f0f8ff; --line:#cbd5e1; --line2:#94a3b8; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
  --green:#10b981; --green-d:#059669; --red:#e0245e;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(to right,var(--navy),var(--navy2));background-attachment:fixed;color:#14171a;margin:0;padding:20px 20px 60px;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1440px;width:100%;margin:0 auto}

/* Cabeçalho */
.app-header{display:flex;align-items:center;justify-content:center;gap:25px;margin:0 auto 20px;padding:20px 35px;background:rgba(255,255,255,.06);border-radius:16px;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);box-shadow:0 8px 25px rgba(0,0,0,.15)}
.app-logo{width:280px;height:auto;max-height:90px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.app-title-group{display:flex;flex-direction:column;justify-content:center;border-left:2px solid rgba(255,255,255,.2);padding-left:25px}
.app-title-group h1{color:#fff;font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:.5px;text-shadow:0 2px 4px rgba(0,0,0,.3);text-transform:uppercase}
.app-title-group h2{color:var(--sky-soft);font-size:15px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:1.5px}

/* Abas */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
.tab{background:rgba(255,255,255,.08);color:#dbeafe;border:1px solid rgba(255,255,255,.12);border-bottom:none;padding:11px 18px;border-radius:12px 12px 0 0;font-size:13px;font-weight:700;letter-spacing:.6px;cursor:pointer;text-transform:uppercase;transition:.2s;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.16);color:#fff}
.tab[data-tab="qrp"]{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.45);color:#d1fae5}
.tab[data-tab="imp"]{background:rgba(29,161,242,.2);border-color:rgba(29,161,242,.5);color:#e0f2fe}
.tab.active{background:var(--panel);color:var(--navy2);border-color:var(--panel)}

/* Container */
.container{background:var(--panel);border-radius:0 16px 16px 16px;box-shadow:0 4px 15px rgba(0,0,0,.15);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 25px;border-bottom:1px solid var(--line);background:#fff}
.toolbar .sep{flex:1}
.field{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.field input{padding:8px 14px;border:1px solid var(--line2);border-radius:9999px;font-size:14px;font-weight:800;color:var(--navy2);outline:none;width:110px;letter-spacing:1px}
.field input:focus,.search:focus{border-color:var(--sky)}
.search{padding:9px 16px;border:1px solid var(--line2);border-radius:9999px;font-size:14px;outline:none;min-width:240px;background:#fff}
.btn{padding:9px 18px;background:var(--sky);color:#fff;border:none;border-radius:9999px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--sky-d)}
.btn-success{background:var(--green)}.btn-success:hover{background:var(--green-d)}
.btn-ghost{background:#fff;color:var(--sky);border:1px solid var(--sky)}.btn-ghost:hover{background:#e8f5fd}
.btn-danger-ghost{background:#fff;color:var(--red);border:1px solid #f4b4c8}.btn-danger-ghost:hover{background:#fdecf1}
.status{font-size:12px;color:var(--muted);font-weight:500}

.section{padding:22px 25px}
.section-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}
.section-head h3{font-size:17px;margin:0;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}
.section-head .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}

/* KPIs */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:110px;flex:1;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.kpi .v{font-size:24px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.main{background:var(--navy2);border-color:var(--navy2)}
.kpi.main .l{color:var(--sky-soft)}.kpi.main .v{color:#fff}

/* Tabela */
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:12px 10px;border-bottom:2px solid var(--line2);color:var(--ink2);font-size:11px;text-transform:uppercase;background:#f8fbff;position:sticky;top:0;white-space:nowrap}
th.num,td.num{text-align:center}
td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
tbody tr:hover{background:#f3faff}
td.est{min-width:230px;max-width:300px;font-weight:700;font-size:12px}
td.est .name{outline:none;border-radius:6px;padding:3px 5px;margin:-3px -5px;display:block}
td.est .name:focus{background:#e0f2fe;box-shadow:0 0 0 2px var(--sky)}
td.chipcell{min-width:170px}
td.num .n{display:inline-block;min-width:38px;padding:5px 10px;border-radius:9999px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;background:#e0f2fe;color:var(--navy2)}
td.num .n.eas{background:#dcfce7;color:#065f46}
td.num .n.zero{background:#f1f5f9;color:#94a3b8}
td.act{width:34px;text-align:center}
.del{background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--red);background:#fdecf1}
tfoot td{background:var(--navy2);color:#fff;font-weight:800;border:none;padding:11px 10px;font-size:12px}
tfoot td.num{font-size:15px}
tfoot input{width:70px;padding:4px 8px;border-radius:9999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:14px;text-align:center;outline:none}
tfoot input::placeholder{color:rgba(255,255,255,.75)}
tfoot input:focus{border-color:#fff;background:rgba(255,255,255,.22)}

/* Post-its */
.chipbox{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start;min-height:30px;padding:4px;border:1px dashed transparent;border-radius:8px;cursor:text;transition:.15s}
.chipbox:hover,.chipbox:focus-within{border-color:var(--line2);background:#fbfdff}
.chip{--c:#fef9c3;--b:#eab308;display:inline-flex;align-items:center;gap:3px;background:var(--c);border-left:3px solid var(--b);color:#1e293b;font-size:11.5px;font-weight:700;padding:3px 4px 3px 7px;border-radius:3px 6px 6px 3px;box-shadow:0 1px 2px rgba(0,0,0,.12);line-height:1.3;max-width:100%;word-break:break-word;}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.chip .t{cursor:default}
.chip button{background:none;border:none;cursor:pointer;color:#64748b;font-size:12px;line-height:1;padding:1px 3px;border-radius:4px;opacity:.55}
.chip button:hover{opacity:1;background:rgba(0,0,0,.08);color:var(--ink)}
.chip.off{opacity:.55;text-decoration:line-through;filter:grayscale(1)}
.k-esf{--c:#dbeafe;--b:#2563eb}.k-eap,.k-eapp{--c:#dcfce7;--b:#16a34a}.k-esb{--c:#ede9fe;--b:#7c3aed}
.k-emulti{--c:#fef3c7;--b:#d97706}.k-ecr{--c:#fce7f3;--b:#db2777}.k-vinc{--c:#ccfbf1;--b:#0d9488}
.chipbox input{border:none;outline:none;background:transparent;font-size:12px;min-width:60px;flex:1;padding:4px 2px;color:var(--ink)}
.chipbox input::placeholder{color:#b6c2d1}
.chip-edit{font:inherit;font-weight:700;border:none;background:#fff;outline:2px solid var(--sky);border-radius:3px;width:120px;padding:0 3px}

.add-row{margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:12px;align-items:center}
.obs{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.obs h4{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.obs .chipbox .chip{--c:#fff7d6;--b:#f59e0b;font-weight:600}
.bloco{margin-bottom:26px}
.bloco:last-child{margin-bottom:0}
.bloco-title{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;font-weight:800;color:var(--navy2);text-transform:uppercase;letter-spacing:.4px}
.bloco-title:before{content:"";width:6px;height:18px;background:var(--sky);border-radius:3px}
.hint{font-size:11px;color:var(--muted);margin-top:6px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

/* Rodapé */
.footer{margin-top:40px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12px;width:100%;max-width:1100px;margin-left:auto;margin-right:auto}
.footer-logo{max-height:50px;width:auto}
.footer-center{text-align:center;display:flex;flex-direction:column;align-items:center}
.footer-center img{max-height:40px;margin-bottom:8px}
.footer-right{text-align:right;line-height:1.6}
.footer-right img{max-height:40px;margin-bottom:10px}

/* Validador QRP */
.qparams{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.qparams .kpi .v.sm{font-size:16px;padding-top:6px}
.qparams input{width:110px;font:inherit;font-size:22px;font-weight:800;color:var(--navy2);border:1px dashed var(--line2);border-radius:8px;padding:0 6px;outline:none;background:#f8fbff}
.qparams input:focus{border:1px solid var(--sky)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px;border:2px dashed var(--sky-soft);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink2);font-size:14px;transition:.2s}
.drop:hover,.drop.over{border-color:var(--sky);background:#e8f5fd}
.drop-ic{font-size:30px;color:var(--sky);line-height:1}
.qlist{margin-top:18px;display:flex;flex-direction:column;gap:18px}
.qcard{background:#fff;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:12px;padding:18px 20px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.qcard.bad{border-left-color:var(--red)}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.qcard{padding:12px 16px}
.qcard.open{padding:16px 20px}
.qtoggle{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:none;border:none;padding:4px 2px;cursor:pointer;text-align:left;font:inherit;flex:1;min-width:0}
.qtoggle:hover .qest{color:var(--sky-d);text-decoration:underline}
.qtoggle .qest{margin:0;font-size:15.5px}
.chev{display:inline-block;color:var(--muted);font-size:14px;transition:transform .2s;width:12px}
.qcard.open .chev{transform:rotate(90deg)}
.qstatus{padding:5px 14px;border-radius:9999px;font-weight:900;font-size:12px;letter-spacing:1px}
.qstatus.good{background:var(--green);color:#fff}.qstatus.bad{background:var(--red);color:#fff}
.qcount{font-size:12px;color:var(--muted);font-weight:600}
.qacts{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-sm{padding:6px 14px;font-size:12px}
.qdist{background:var(--navy2);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:4px 9px;border-radius:6px}
.qdist.muted{background:#94a3b8}
.qid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:800;color:var(--navy2);background:#e0f2fe;padding:3px 9px;border-radius:6px}
.qenvio{font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:6px;border:1.5px solid}
.qenvio.final{color:#1d4ed8;border-color:#93c5fd;background:#eff6ff}.qenvio.previa{color:#92400e;border-color:#fcd34d;background:#fffbeb}
.drop{cursor:default}
.drop-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
.qfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qfilters select{padding:8px 12px;border:1px solid var(--line2);border-radius:9999px;font-size:13px;background:#fff;color:var(--ink);font-weight:600}
.qfilters .search{min-width:220px}
.qfilters .sep{flex:1}
.qstage{margin-top:16px;background:#fff;border:2px solid var(--sky);border-radius:14px;padding:16px 18px;box-shadow:0 6px 18px rgba(29,161,242,.12)}
.qstage-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.qstage h4{margin:0 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy2)}
.stlist{margin-top:10px;max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.strow{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #eef2f7;cursor:pointer;font-size:13px}
.strow:last-child{border-bottom:none}
.strow:hover{background:#f3faff}.strow.on{background:#e8f5fd}
.strow input{width:17px;height:17px;accent-color:var(--sky);cursor:pointer;margin:0}
.stname{font-weight:700;color:var(--ink)}
.qstage .qfilters{border:none;padding:0;background:none}
.qstage-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.qstage-foot .sep{flex:1}
.apont.aviso{background:#fffbeb;border-color:#fde68a}.apont.aviso h4{color:#92400e}
.apont ul{margin:0;padding-left:20px}
.qbody{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qfile{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;word-break:break-all}
.qest{font-size:17px;font-weight:800;color:var(--ink);margin-top:3px}
.qtab{font-size:10.5px;background:#e0f2fe;color:var(--navy2);padding:3px 9px;border-radius:9999px;vertical-align:middle;margin-left:6px}
.qmeta{font-size:12px;color:var(--muted);margin-top:4px}
.qbadge{padding:8px 16px;border-radius:9999px;font-weight:800;font-size:12px;letter-spacing:.4px;white-space:nowrap}
.qbadge.good{background:#dcfce7;color:#065f46}.qbadge.bad{background:#fdecf1;color:#9f1239}
.qbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.qbar .sep{flex:1}
.qbar select{padding:8px 12px;border:1px solid var(--line2);border-radius:9999px;font-size:13px;max-width:420px;background:#fff;color:var(--ink);text-transform:none;font-weight:600}
table.qt td{white-space:normal;vertical-align:middle}
.pill{display:inline-block;padding:4px 10px;border-radius:9999px;font-weight:800;font-size:11px;white-space:nowrap}
.pill.ok{background:#dcfce7;color:#065f46}.pill.bad{background:#fdecf1;color:#be123c}.pill.warn{background:#fef3c7;color:#92400e}.pill.muted{background:#f1f5f9;color:#64748b}
.apont{margin:14px 0;background:#fff7f9;border:1px solid #f9c6d5;border-radius:10px;padding:12px 18px;font-size:13px;color:var(--ink)}
.apont.good{background:#f0fdf4;border-color:#bbf7d0}
.apont h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#be123c}
.apont.good h4{color:#065f46}
.apont ol{margin:0;padding-left:20px}.apont li{margin:4px 0;line-height:1.45}
.qgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:1000px){.qgrid{grid-template-columns:1fr}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:768px){
  body{padding:10px 10px 40px}
  .app-header{flex-direction:column;text-align:center;gap:15px;padding:20px 15px}
  .app-logo{max-width:200px}
  .app-title-group{border-left:none;border-top:1px solid rgba(255,255,255,.2);padding-left:0;padding-top:15px}
  .app-title-group h1{font-size:22px}.app-title-group h2{font-size:12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:0}
  .container{border-radius:0 0 16px 16px}
  .toolbar,.section{padding:14px}
  .search{min-width:0;width:100%}
  .footer{flex-direction:column;gap:30px}
  .footer-left,.footer-center,.footer-right{text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <img src="https://gmnadroj.github.io/CONSULTA-SERVIDOR-PVD/logo_did.png" alt="Diretoria de Inteligência de Dados" class="app-logo" onerror="this.style.display='none'">
    <div class="app-title-group">
      <h1>GESTOR MAPEADO</h1>
      <h2>Secretaria Municipal de Saúde - SEMSA · Competência <span id="hComp"></span></h2>
    </div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <div class="container">
    <div class="toolbar">
      <label class="field">Competência <input id="comp" maxlength="6" inputmode="numeric"></label>
      <input class="search" id="search" type="search" placeholder="Buscar estabelecimento, INE ou unidade…">
      <span class="sep"></span>
      <span class="status" id="status"></span>
      <button class="btn btn-success" id="pdfAll">⬇ Exportar PDF (todas as abas)</button>
      <button class="btn btn-ghost" id="pdfOne">PDF desta aba</button>
      <button class="btn btn-ghost" id="xlsx">Excel</button>
      <button class="btn btn-ghost" id="bkp" title="Baixa um arquivo .json com todos os dados">Backup</button>
      <button class="btn btn-ghost" id="imp" title="Carrega um backup .json">Importar</button>
      <button class="btn btn-danger-ghost" id="reset" title="Volta aos dados da planilha original">Restaurar</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </div>
    <div id="view"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-left"><img src="https://gmnadroj.github.io/CONSULTA-SERVIDOR-PVD/logo_pmm_white.png" alt="Prefeitura de Manaus" class="footer-logo" onerror="this.style.display='none'"></div>
  <div class="footer-center">
    <img src="https://gmnadroj.github.io/CONSULTA-SERVIDOR-PVD/logo_did.png" alt="DID" onerror="this.style.display='none'">
    <div>Diretoria de Inteligência de Dados</div>
    <div>Gerência de Análise e Estatística</div>
    <div>DID © 2026</div>
  </div>
  <div class="footer-right">
    <img src="https://gmnadroj.github.io/CONSULTA-SERVIDOR-PVD/logo-semsa-cabecalho-white.png" alt="SEMSA" onerror="this.style.display='none'"><br>
    Av. Maceió, 160 - Adrianópolis<br>Manaus - AM, 69029-520<br>Telefone: (92) 3214-5072
  </div>
</div>
<div class="toast" id="toast"></div>

let state, current, query = '';

function hydrate(d){
  const s = JSON.parse(JSON.stringify(d));
  const fix = r => { r.id = r.id || uid(); return r; };
  for (const t of Object.values(s.tabs)){
    (t.rows||[]).forEach(fix);
    (t.blocos||[]).forEach(b => { b.id = b.id||uid(); b.rows.forEach(fix); b.ovr = b.ovr||{}; b.obs = b.obs||[]; });
    t.obs = (t.obs || []).map(o => typeof o==='string' ? {v:o} : o);
    (t.blocos||[]).forEach(b => b.obs = b.obs.map(o => typeof o==='string' ? {v:o} : o));
  }
  return s;
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const count = arr => (arr||[]).filter(c => !c.off).length;
const rowTeams = (r, cols) => teamCols(cols).reduce((a,k) => a + count(r.f[k]), 0);
const rowEas = r => 1 + count(r.f.vinc);
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
function rowMatches(r){
  if (!query) return true;
  const q = query.toLowerCase();
  return r.nome.toLowerCase().includes(q) || Object.values(r.f).some(a => a.some(c => c.v.toLowerCase().includes(q)));
}
function blocoTotals(b){
  const t = {};
  b.cols.forEach(k => t[k] = b.ovr[k] ?? b.rows.reduce((a,r)=>a+count(r.f[k]),0));
  const autoEq = b.cols.reduce((a,k)=>a+t[k],0);
  t.eq = b.ovr.eq ?? autoEq; t._autoEq = autoEq;
  t._autoEas = b.rows.length;
  t.eas = b.ovr.eas ?? t._autoEas;
  return t;
}
function tabTotals(tab){
  const d = state.tabs[tab.id], res = {est:0, eq:0, eas:0, por:{}};
  if (tab.tipo === 'mapa'){
    tab.cols.forEach(k => res.por[k] = 0);
    d.rows.forEach(r => { res.est++; tab.cols.forEach(k => res.por[k] += count(r.f[k])); res.eq += rowTeams(r, tab.cols); res.eas += rowEas(r); });
  } else {
    d.blocos.forEach(b => { const t = blocoTotals(b); res.est += b.rows.length; res.eq += t.eq; res.eas += t.eas;
      b.cols.forEach(k => res.por[k] = (res.por[k]||0) + t[k]); });
  }
  return res;
}

document.addEventListener('keydown', e => {
  const inp = e.target;
  if (inp.matches('.chipbox > input')){
    const box = inp.parentElement, arr = arrFor(box.dataset.path, box.dataset.k);
    const isObs = box.dataset.k === 'obs';
    if (e.key==='Enter' || (!isObs && e.key===',')){
      e.preventDefault();
      const vals = isObs ? [inp.value.trim()] : inp.value.split(/[,;/]/).map(s=>s.trim());
      vals.filter(Boolean).forEach(v => arr.push({v}));
      inp.value = '';
      if (vals.some(Boolean)) refresh(box.dataset.path, box.dataset.k);
    } else if (e.key==='Backspace' && !inp.value && arr.length){
      arr.pop(); refresh(box.dataset.path, box.dataset.k);
    }
  }
  if (inp.matches('.name') && e.key==='Enter'){ e.preventDefault(); inp.blur(); }
  if (inp.matches('.chip-edit')){
    if (e.key==='Enter') inp.blur();
    if (e.key==='Escape'){ inp.dataset.cancel='1'; inp.blur(); }

const TIPO_KEY = {ESF:'esf', EAP:'eap', ESB:'esb', EMULTI:'emulti', ECR:'ecr', EAPP:'eapp'};
const cfg = () => (state.config = state.config || {versao:'4.8.50'});
const fmtComp = c => c ? `${c.slice(4,6)}/${c.slice(0,4)}` : '-';
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const nkey = s => norm(String(s).split('(')[0]).replace(/[^A-Z0-9]/g,'');
const estKey = s => norm(s).replace(/^\s*(USF|UBS|UBSF|USF\s*-)\s+/,'').replace(/[^A-Z0-9]/g,'');
function teamKey(nome, tipo){
  let s = norm(nome).replace(/[^A-Z0-9 ]/g,' ').trim();
  const pref = norm(tipo||'').replace(/[^A-Z]/g,'');
  if (pref && s.replace(/\s/g,'').startsWith(pref)) s = s.replace(/\s/g,'').slice(pref.length);
  s = s.replace(/[^A-Z0-9]/g,'');
  return /^\d+$/.test(s) ? String(+s) : s;
}
const chipKey = v => { const k = nkey(v); return /^\d+$/.test(k) ? String(+k) : k; };
function cmpVer(a,b){ const x=a.split('.').map(Number), y=b.split('.').map(Number); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d<0?-1:1; } return 0; }

/* --- leitura do .qrp (relatório EMF com texto UTF-16) --- */
function parseQRP(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf), items = [];
  let page = 0;
  for (let p = 40; p < u8.length - 4; p++){
    if (u8[p]!==0x20 || u8[p+1]!==0x45 || u8[p+2]!==0x4D || u8[p+3]!==0x46) continue;
    let off = p - 40;
    if (off < 0 || dv.getUint32(off,true) !== 1) continue;
    page++;
    while (off + 8 <= u8.length){
      const type = dv.getUint32(off,true), size = dv.getUint32(off+4,true);
      if (size < 8 || off + size > u8.length) break;
      if ((type===84 || type===83) && size >= 76){
        const x = dv.getInt32(off+36,true), y = dv.getInt32(off+40,true);
        const n = dv.getUint32(off+44,true), so = dv.getUint32(off+48,true);
        let s = '';
        if (type===84){ for (let i=0;i<n;i++){ const o=off+so+2*i; if (o+1>=u8.length) break; s += String.fromCharCode(dv.getUint16(o,true)); } }
        else { for (let i=0;i<n;i++) s += String.fromCharCode(u8[off+so+i]); }
        s = s.replace(/\u0000/g,'').trim();
        if (s) items.push({page, x, y, s});
      }
      if (type === 14) break;
      off += size;
    }
    p = off;
  }
  if (!items.length) throw new Error('Não foi possível ler o protocolo (arquivo .qrp sem texto reconhecível).');
  const d = {equipes:[], estabelecimentos:[], totalEq:null, totalEst:null, paginas:page};
  let sec = null;
  items.forEach((it, i) => {
    const s = it.s; let m;
    if ((m = s.match(/Compet[eê]ncia\s*:\s*(\d{2})\/(\d{4})/i))) d.competencia = m[2]+m[1];
    if ((m = s.match(/Vers[aã]o\s*:\s*([\d.]+)/i))) d.versao = m[1];
    if ((m = s.match(/Tipo\s*:\s*(.*?)\s+Origem\s*:\s*(.*?)\s+Destino\s*:\s*(.*)$/i))){ d.tipo=m[1].trim(); d.origem=m[2].trim(); d.destino=m[3].trim(); }
    else if ((m = s.match(/^Tipo\s*:\s*(.+)$/i))) d.tipo = m[1].trim();
    if ((m = s.match(/gera[cç][aã]o da exporta[cç][aã]o\s*:\s*(.+)$/i))) d.geracao = m[1].trim();
    if ((m = s.match(/Nome do Arquivo\s*:\s*(.+)$/i))) d.arquivo = m[1].trim();
    if ((m = s.match(/^Munic[ií]pio\s*:\s*(.+)$/i))) d.municipio = m[1].trim();
    if (/EQUIPE\(S\)\s*EXPORTADA/i.test(s)){ sec='eq'; return; }
    if (/ESTABELECIMENTO\(S\)\s*EXPORTADO/i.test(s)){ sec='est'; return; }
    if ((m = s.match(/^TOTAL\s*:\s*(\d+)/i))){ if (sec==='eq') d.totalEq=+m[1]; else if (sec==='est') d.totalEst=+m[1]; sec=null; return; }
    if (sec==='eq' && (m = s.match(/^(\d{7})\s*-\s*(\d+)\s*-\s*(.+)$/))){
      const nx = items.slice(i+1).find(o => o.page===it.page && Math.abs(o.y-it.y)<=4 && o.x>it.x);
      const tipoTxt = nx ? nx.s : '';
      const sigla = norm(tipoTxt.split(' - ')[0] || m[3].split('-')[0]).replace(/[^A-Z]/g,'');
      d.equipes.push({cnes:m[1], area:m[2], nome:m[3].trim(), tipo:tipoTxt, sigla, key:teamKey(m[3], sigla)});
    } else if (sec==='est' && (m = s.match(/^(\d{7})\s*-\s*(.+)$/))){
      d.estabelecimentos.push({cnes:m[1], nome:m[2].trim()});
    }
  });
  if (d.totalEq===null) d.totalEq = d.equipes.length;
  if (d.totalEst===null) d.totalEst = d.estabelecimentos.length;
  return d;
}

/* --- estabelecimentos do Gestor Mapeado --- */
function allRows(){
  const out = [];
  TABS.forEach(tab => {
    const t = state.tabs[tab.id]; if (!t) return;
    if (tab.tipo==='mapa') t.rows.forEach(r => out.push({tab, row:r, cols:tab.cols}));
    else if (tab.tipo==='blocos') t.blocos.forEach(b => b.rows.forEach((r,i) => out.push({tab, row:r, cols:b.cols, bloco:b, base:i===0})));
  });
  return out;
}
function findRow(id){ return allRows().find(x => x.row.id === id); }
/* --- pasta do envio: DISTRITO-ID_NNNN-ESTABELECIMENTO-final|previa-DDMMAAAAHHMMSS --- */
const DIST_TABS = {LESTE:['leste'], NORTE:['norte'], SUL:['sul'], OESTE:['oeste','centr','mmt'], RURAL:['centr'], CENTRAL:['samu','mmt','centr'], PRISIONAIS:['prisionais']};
function parsePasta(nome){
  const m = String(nome).trim().match(/^([A-Za-zÀ-ÿ ]+?)\s*-\s*ID[\s_-]*(\d+)\s*-\s*(.+?)\s*-\s*(pr[eé]via|final)\s*(?:-\s*(\d{8,14}))?\s*$/i);
  if (!m) return {padrao:false, raw:nome, nome:String(nome).trim()};
  let data = null;
  if (m[5] && m[5].length>=8){ const t=m[5]; data = `${t.slice(0,2)}/${t.slice(2,4)}/${t.slice(4,8)}` + (t.length>=12 ? ` ${t.slice(8,10)}:${t.slice(10,12)}` : ''); }
  const ord = m[5] ? m[5].slice(4,8)+m[5].slice(2,4)+m[5].slice(0,2)+m[5].slice(8) : '';
  return {padrao:true, raw:nome, distrito:norm(m[1]).trim(), id:m[2], nome:m[3].trim(), envio: /final/i.test(m[4]) ? 'FINAL' : 'PRÉVIA', data, ord};
}
function autoMatch(d, pasta){
  const rows = allRows(); let best=null, score=0;
  const pref = pasta && pasta.padrao ? (DIST_TABS[pasta.distrito] || []) : [];
  const nomes = [];
  if (pasta && pasta.nome) nomes.push({nome:pasta.nome, peso:1.05});
  d.estabelecimentos.forEach(e => nomes.push({nome:e.nome, peso:1}));
  nomes.forEach(({nome, peso}) => {
    const ek = estKey(nome), et = new Set(norm(nome).split(/\W+/).filter(w=>w.length>2 && w!=='USF'));
    rows.forEach(x => {
      const rk = estKey(x.row.nome); let sc = 0;
      if (rk === ek) sc = 100;
      else if (ek.length>4 && (rk.startsWith(ek) || rk.includes(ek) || ek.startsWith(rk))) sc = 80;
      else { const rt = new Set(norm(x.row.nome).split(/\W+/).filter(w=>w.length>2 && w!=='USF')); const inter=[...et].filter(w=>rt.has(w)).length; const uni=new Set([...et,...rt]).size; sc = uni? 70*inter/uni : 0; }
      sc *= peso; if (pref.includes(x.tab.id)) sc += 8;
      if (sc > score){ score = sc; best = x; }
    });
  });
  return score >= 40 ? best.row.id : null;
}
const bckKey = s => String(s||'').trim().toLowerCase().replace(/\.bck$/,'').replace(/_ok$/,'');

/* --- análise das críticas --- */
function analisar(f){
  const d = f.data, c = cfg(), x = f.matchId ? findRow(f.matchId) : null;
  const res = {criticas:[], apont:[], avisos:[], equipes:[], ests:[], x};
  let espEq=null, espEas=null;
  if (x){
    if (x.bloco && x.base){ const t = blocoTotals(x.bloco); espEq=t.eq; espEas=t.eas; }
    else { espEq=rowTeams(x.row,x.cols); espEas= x.cols.includes('vinc') ? rowEas(x.row) : 1; }
  }
  const add = (n, nome, esperado, obtido, ok, apont) => { res.criticas.push({n, nome, esperado, obtido, ok}); if (!ok && apont) res.apont.push(apont); };
  add(1,'Competência vigente', fmtComp(state.competencia), d.competencia?fmtComp(d.competencia):'não informada', d.competencia===state.competencia,
    `Competência do protocolo (${d.competencia?fmtComp(d.competencia):'não identificada'}) diferente da competência ativa (${fmtComp(state.competencia)}). Gerar nova exportação no SCNES na competência ${fmtComp(state.competencia)} e reenviar pelo Transmissor.`);
  const vOk = d.versao && cmpVer(d.versao, c.versao)===0;
  add(2,'Versão do SCNES', c.versao, d.versao||'não informada', vOk,
    !d.versao ? 'Versão do SCNES não identificada no protocolo. Verificar o arquivo gerado.' :
    cmpVer(d.versao,c.versao)<0 ? `SCNES desatualizado (versão ${d.versao}). Atualizar para a versão ${c.versao}, gerar nova exportação e reenviar.` :
    `Versão do protocolo (${d.versao}) diferente da versão vigente parametrizada (${c.versao}). Confirmar a versão oficial do SCNES.`);
  add(3,'Tipo de exportação', 'Completa', d.tipo||'não informado', norm(d.tipo)==='COMPLETA',
    `Tipo de exportação "${d.tipo||'-'}". A exportação deve ser do tipo COMPLETA: refazer a exportação selecionando "Completa".`);
  const ests = d.estabelecimentos, eqs = d.equipes;
  add(4,'Nº de estabelecimentos', espEas ?? '—', d.totalEst, espEas!==null && d.totalEst===espEas,
    espEas===null ? 'Estabelecimento não localizado no Gestor Mapeado: selecione o estabelecimento correspondente para comparar.' :
    `O protocolo exportou ${d.totalEst} estabelecimento(s), mas o Gestor Mapeado prevê ${espEas} (Qtde. EAS). Verificar no SCNES local as unidades vinculadas exportadas (detalhamento abaixo).`);
  add(5,'Nº de equipes', espEq ?? '—', d.totalEq, espEq!==null && d.totalEq===espEq,
    espEq===null ? null :
    `O protocolo exportou ${d.totalEq} equipe(s), mas o Gestor Mapeado prevê ${espEq} (Qtde. Equipes). Conferir no SCNES as equipes ausentes/excedentes (detalhamento abaixo).`);
  add(6,'Destino', 'Município P. Gestão', d.destino||'não informado', norm(d.destino).replace(/\s+/g,' ')==='MUNICIPIO P. GESTAO',
    `Destino da exportação "${d.destino||'-'}". Refazer a exportação com destino "Município P. Gestão".`);
  if (f.porPasta){
    const alvo = bckKey(d.arquivo), bs = f.bcks || [];
    const igual = bs.find(b => bckKey(b) === alvo);
    add(7,'Arquivo de base (.bck)', d.arquivo || 'informado no protocolo', bs.length ? bs.join(', ') : 'ausente na pasta', !!igual && !!alvo,
      !bs.length ? `A pasta do envio não contém o arquivo de base (.bck). Reenviar a base ${d.arquivo||''} junto com o protocolo pelo Transmissor.` :
      !igual ? `A base enviada (${bs.join(', ')}) não corresponde ao arquivo citado no protocolo (${d.arquivo||'-'}). Reenviar a base e o protocolo da MESMA exportação.` : null);
    if (igual && bs.length > 1) res.avisos.push(`A pasta contém ${bs.length} arquivos .bck; apenas ${igual} corresponde ao protocolo.`);
    if ((f.qrpsNaPasta||1) > 1) res.avisos.push(`A pasta contém ${f.qrpsNaPasta} protocolos .qrp — cada um foi analisado separadamente.`);
  }
  if (f.pasta && f.pasta.padrao){
    const pref = DIST_TABS[f.pasta.distrito];
    if (x && pref && !pref.includes(x.tab.id)) res.avisos.push(`Envio feito pelo distrito ${f.pasta.distrito}, mas o estabelecimento está mapeado em ${x.tab.nome}.`);
    if (f.pasta.envio === 'PRÉVIA') res.avisos.push('Envio do tipo PRÉVIA — aguardar o envio FINAL para o fechamento da competência.');
  } else if (f.porPasta) res.avisos.push(`Nome da pasta fora do padrão do Transmissor (DISTRITO-ID_NNNN-ESTABELECIMENTO-final/previa-DATA): "${f.pasta?.raw||''}".`);
  if (d.equipes.length !== d.totalEq) res.apont.push(`Inconsistência interna do protocolo: ${d.equipes.length} equipe(s) listada(s) e TOTAL informado ${d.totalEq}.`);

  // detalhamento: equipes
  if (x){
    const tc = teamCols(x.cols), gest = [];
    const rowsForTeams = (x.bloco && x.base) ? x.bloco.rows : [x.row];
    rowsForTeams.forEach(r => tc.forEach(k => (r.f[k]||[]).forEach(ch => gest.push({k, v:ch.v, off:!!ch.off, key:chipKey(ch.v), used:false}))));
    eqs.forEach(e => {
      const k = TIPO_KEY[e.sigla] || null;
      let g = gest.find(g => !g.used && g.key===e.key && (!k || g.k===k));
      if (!g) g = gest.find(g => !g.used && g.key===e.key);
      if (g){ g.used = true;
        const tipoDiv = k && g.k!==k;
        res.equipes.push({nome:e.nome, ine:`${e.cnes} - ${e.area}`, tipo:e.sigla, gestor:`${COLS[g.k].l}: ${g.v}`, st: g.off?'off':tipoDiv?'tipo':'ok'});
        if (g.off) res.apont.push(`Equipe ${e.nome} (${e.sigla}) foi exportada, mas está marcada como DESATIVADA no Gestor Mapeado. Confirmar a situação da equipe.`);
        if (tipoDiv) res.apont.push(`Equipe ${e.nome}: tipo no protocolo ${e.sigla}, no Gestor Mapeado está em ${COLS[g.k].l}. Conferir o tipo da equipe.`);
      } else {
        res.equipes.push({nome:e.nome, ine:`${e.cnes} - ${e.area}`, tipo:e.sigla, gestor:'—', st:'extra'});
        res.apont.push(`Equipe ${e.nome} (${e.sigla}) consta no protocolo, mas NÃO está mapeada no Gestor Mapeado. Verificar se é equipe nova ou cadastrada no estabelecimento errado.`);
      }
    });
    gest.filter(g => !g.used && !g.off).forEach(g => {
      res.equipes.push({nome:g.v, ine:'—', tipo:COLS[g.k].l, gestor:`${COLS[g.k].l}: ${g.v}`, st:'falta'});
      res.apont.push(`Equipe ${COLS[g.k].l} ${g.v} está mapeada no Gestor Mapeado, mas NÃO foi exportada no protocolo. Verificar no SCNES local se a equipe está ativa e vinculada ao estabelecimento.`);
    });
    // estabelecimentos
    const vinc = x.cols.includes('vinc') ? (x.row.f.vinc||[]).map(ch => ({v:ch.v, off:!!ch.off, key:estKey(ch.v), used:false})) : [];
    const mainKey = estKey(x.row.nome);
    let mainFound = false;
    ests.forEach(e => {
      const ek = estKey(e.nome);
      if (!mainFound && (ek===mainKey || (ek.length>4 && mainKey.includes(ek)) || f.mainCnes===e.cnes)){ mainFound = true; f.mainCnes = e.cnes; res.ests.push({cnes:e.cnes, nome:e.nome, gestor:'Estabelecimento principal', st:'ok'}); return; }
      const v = vinc.find(v => !v.used && (v.key===ek || ek.endsWith(v.key) || v.key.endsWith(ek)));
      if (v){ v.used = true; res.ests.push({cnes:e.cnes, nome:e.nome, gestor:`Vinculada: ${v.v}`, st:v.off?'off':'ok'});
        if (v.off) res.apont.push(`Unidade ${e.nome} foi exportada, mas está marcada como DESATIVADA no Gestor Mapeado.`); }
      else { res.ests.push({cnes:e.cnes, nome:e.nome, gestor:'—', st:'extra'});
        res.apont.push(`Estabelecimento ${e.cnes} - ${e.nome} consta no protocolo, mas não está mapeado no Gestor Mapeado (nem como unidade vinculada).`); }
    });
    if (!mainFound && !(x.bloco && x.base)){ res.ests.unshift({cnes:'—', nome:x.row.nome, gestor:'Estabelecimento principal', st:'falta'});
      res.apont.push(`O estabelecimento principal (${x.row.nome}) não foi identificado na lista de estabelecimentos exportados.`); }
    vinc.filter(v => !v.used && !v.off).forEach(v => { res.ests.push({cnes:'—', nome:v.v, gestor:`Vinculada: ${v.v}`, st:'falta'});
      res.apont.push(`Unidade vinculada ${v.v} está mapeada no Gestor Mapeado, mas NÃO foi exportada no protocolo. Verificar se a unidade foi incluída na base local do SCNES.`); });
  } else {
    eqs.forEach(e => res.equipes.push({nome:e.nome, ine:`${e.cnes} - ${e.area}`, tipo:e.sigla, gestor:'—', st:'na'}));
    ests.forEach(e => res.ests.push({cnes:e.cnes, nome:e.nome, gestor:'—', st:'na'}));
  }
  res.ok = res.criticas.every(c => c.ok) && res.apont.length===0;
  res.nCrit = res.criticas.filter(c=>!c.ok).length;
  return res;
}

/* --- interface --- */
const ST = {ok:['✔','Confere','ok'], extra:['▲','Só no protocolo','warn'], falta:['▼','Não exportada','bad'], off:['⊘','Desativada no Gestor','warn'], tipo:['≠','Tipo divergente','warn'], na:['–','Sem vínculo','muted']};
function rowOptions(sel){

let qf = {q:'', dist:'', envio:'', st:''};

function qEnvio(f){ const p=f.pasta; return p && p.padrao ? `<span class="qenvio ${p.envio==='FINAL'?'final':'previa'}">${p.envio}</span>` : ''; }
function qSorted(){
  return qrpFiles.slice().sort((a,b) => {

}
function qVisible(list){
  let out = list;

    list.forEach(f => { const k = (f.matchId || estKey(qName(f))) ; const o = (f.pasta&&f.pasta.ord)||''; if (!last[k] || o > ((last[k].pasta&&last[k].pasta.ord)||'')) last[k]=f; });
    const keep = new Set(Object.values(last)); out = out.filter(f => keep.has(f));
  }
  return out.filter(f => {
    if (qf.dist && (f.pasta?.distrito||'') !== qf.dist) return false;
    if (qf.envio==='FINAL' || qf.envio==='PRÉVIA') if ((f.pasta?.envio||'') !== qf.envio) return false;
    if (qf.st){ const ok = !f.erro && analisar(f).ok; if (qf.st==='V' && !ok) return false; if (qf.st==='R' && ok) return false; }
    if (qf.q){ const q = norm(qf.q); const hay = norm([f.nome, f.pasta?.raw, f.pasta?.id, qName(f), f.data?.arquivo, ...(f.data?.estabelecimentos||[]).map(e=>e.cnes+' '+e.nome)].join(' ')); if (!hay.includes(q)) return false; }
    return true;
  });
}

/* --- carga: arquivos soltos ou pastas (cada pasta = um envio) --- */
function groupEntries(entries){   // entries: [{file, path}] -> grupos por pasta
  const dirs = new Map();
  entries.forEach(({file, path}) => {
    const parts = (path || file.name).split('/').filter(Boolean); parts.pop();
    const dir = parts.join('/');
    if (parts.some(p => /^PARA IMPORTA[CÇ][AÃ]O$/i.test(norm(p)) || /^PARA IMPORTACAO$/.test(norm(p)))) return;   // ignora a pasta gerada pela importação
    if (!dirs.has(dir)) dirs.set(dir, {dir, nome: parts[parts.length-1] || '', qrps:[], bcks:[], bckSz:{}});
    if (/\.qrp$/i.test(file.name)) dirs.get(dir).qrps.push(file);
    else if (/\.bck$/i.test(file.name)){ dirs.get(dir).bcks.push(file.name); dirs.get(dir).bckSz[file.name] = file.size; }
  });
  return [...dirs.values()].filter(g => g.qrps.length || (g.dir && g.bcks.length))
    .map(g => Object.assign(g, {pasta: g.dir ? parsePasta(g.nome) : null}));
}
function analyzeGroups(groups){
  const jobs = [], vistos = new Set(qrpFiles.map(f => f.chave));
  groups.forEach(g => {
    const porPasta = !!g.dir, pasta = g.pasta;
    if (!g.qrps.length){
      if (!vistos.has(g.dir+'/')) jobs.push(Promise.resolve({id:uid(), chave:g.dir+'/', nome:'(sem .qrp)', pasta, porPasta, bcks:g.bcks, erro:'Pasta sem protocolo .qrp — reenviar o protocolo de exportação junto com a base.'}));
      return;
    }
    g.qrps.forEach(file => {
      const chave = g.dir + '/' + file.name; if (vistos.has(chave)) return; vistos.add(chave);
      jobs.push(file.arrayBuffer().then(buf => {
        const f = {id:uid(), chave, nome:file.name, pasta, porPasta, bcks:g.bcks, bckSz:g.bckSz, qrpsNaPasta:g.qrps.length};
        try { f.data = parseQRP(buf); f.matchId = autoMatch(f.data, pasta); } catch(e){ f.erro = e.message; }
        return f;
      }));
    });
  });
  if (!jobs.length){ toast('Esses envios já estão na lista'); return; }
  $('#qprog') && ($('#qprog').textContent = `Lendo ${jobs.length} protocolo(s)…`);
  Promise.all(jobs).then(arr => { qrpFiles = qrpFiles.concat(arr); render(); toast(`${arr.length} envio(s) analisado(s)`); });
}
/* seleção de pastas: com mais de uma pasta de envio, abre a lista para marcar */
let qStage = null;   // {groups:[...], f:{q,dist,envio}}
function addQrpEntries(entries){
  const groups = groupEntries(entries);
  if (!groups.length){ toast('Nenhum arquivo .qrp ou .bck encontrado'); return; }
  const loose = groups.filter(g => !g.dir), folders = groups.filter(g => g.dir);
  if (loose.length) analyzeGroups(loose);
  if (folders.length === 1 && !qStage) { analyzeGroups(folders); return; }
  if (!folders.length) return;
  const carregadas = new Set(qrpFiles.map(f => f.chave.replace(/\/[^/]*$/,'')));
  if (!qStage) qStage = {groups:[], f:{q:'', dist:'', envio:''}};
  const ja = new Set(qStage.groups.map(g => g.dir));
  folders.forEach(g => { if (ja.has(g.dir)) return; g.loaded = carregadas.has(g.dir); g.checked = false; qStage.groups.push(g); });
  qStage.groups.sort((a,b) => (a.pasta?.distrito||'ZZZ').localeCompare(b.pasta?.distrito||'ZZZ') || (+a.pasta?.id||1e9)-(+b.pasta?.id||1e9) || a.nome.localeCompare(b.nome));
  render();
  document.getElementById('qstage')?.scrollIntoView({behavior:'smooth', block:'start'});
}
function stageVisible(){
  const f = qStage.f;
  return qStage.groups.filter(g => {
    if (f.dist && (g.pasta?.distrito||'') !== f.dist) return false;
    if (f.envio && (g.pasta?.envio||'') !== f.envio) return false;
    if (f.q && !norm(g.nome).includes(norm(f.q))) return false;
    return true;
  });
}

      <select id="ste"><option value="">Final e prévia</option><option value="FINAL"${qStage.f.envio==='FINAL'?' selected':''}>Somente FINAL</option><option value="PRÉVIA"${qStage.f.envio==='PRÉVIA'?' selected':''}>Somente PRÉVIA</option></select>
      <button class="btn btn-ghost btn-sm" id="stAll">${allVisChecked?'Desmarcar':'Marcar'} todas as exibidas (${vis.length})</button>
      <button class="btn btn-ghost btn-sm" id="stLast" title="Marca apenas o envio mais recente de cada estabelecimento">Marcar último envio de cada estabelecimento</button>
      <button class="btn btn-ghost btn-sm" id="stNone">Limpar marcação</button>
    </div>
    <div class="stlist">${vis.map(g => { const i = qStage.groups.indexOf(g), p = g.pasta || {};
      return `<label class="strow${g.checked?' on':''}">
        <input type="checkbox" data-st="${i}"${g.checked?' checked':''}>
        ${p.padrao ? `<span class="qdist">${esc(p.distrito)}</span><span class="qid">ID ${esc(p.id)}</span>` : `<span class="qdist muted">PASTA</span>`}
        <span class="stname">${esc(p.padrao ? p.nome : g.nome)}</span>
        ${p.padrao ? `<span class="qenvio ${p.envio==='FINAL'?'final':'previa'}">${p.envio}</span>` : ''}
        <span class="qcount">${p.data ? esc(p.data)+' · ' : ''}${g.qrps.length} .qrp · ${g.bcks.length} .bck</span>
        ${!g.qrps.length ? '<span class="pill bad">sem .qrp</span>' : ''}
        ${g.loaded ? '<span class="pill muted">já analisada</span>' : ''}
      </label>`; }).join('') || '<div class="empty">Nenhuma pasta para os filtros.</div>'}</div>
    <div class="qstage-foot">

}

function readEntryTree(entry, path, out){
  return new Promise(res => {
    if (entry.isFile){ entry.file(f => { out.push({file:f, path: path + f.name}); res(); }, () => res()); }
    else if (entry.isDirectory){
      const rd = entry.createReader(), all = [];
      const next = () => rd.readEntries(es => { if (!es.length) Promise.all(all.map(e => readEntryTree(e, path + entry.name + '/', out))).then(res); else { all.push(...es); next(); } }, () => res());
      next();
    } else res();
  });
}

/* --- PDF de críticas --- */
function qrpPDF(files){
  if (!files.length) return;
  if (!window.jspdf){ toast('Biblioteca de PDF não carregou — verifique a internet'); return; }
  const { jsPDF } = window.jspdf, doc = new jsPDF({unit:'mm', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const header = () => {
    doc.setFillColor(7,46,80); doc.rect(0,0,W,22,'F'); doc.setFillColor(3,75,117); doc.rect(W*0.55,0,W*0.45,22,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('RELATÓRIO DE CRÍTICAS — PROTOCOLO SCNES', 12, 10);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(165,208,245);
    doc.text('TRANSMISSOR DID · GESTOR MAPEADO · SECRETARIA MUNICIPAL DE SAÚDE - SEMSA', 12, 16);
  };
  const colors = {ok:[16,185,129], bad:[224,36,94], warn:[217,119,6], muted:[100,116,139]};
  files.forEach((f, fi) => {
    if (fi) doc.addPage();

    let y = 30;
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(12);

    const st = r.ok ? 'VALIDADO' : 'REJEITADO';
    doc.setFillColor(...(r.ok?colors.ok:colors.bad)); doc.roundedRect(W-58, y-5.5, 46, 8, 4, 4, 'F');
    doc.setTextColor(255); doc.setFontSize(9); doc.text(st, W-35, y-0.3, {align:'center'});
    y += 5*tl.length + 1;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(51,65,85);
    const p = f.pasta;
    [ ...(p && p.padrao ? [`Distrito de envio: ${p.distrito}     ID do Transmissor: ${p.id}     Envio: ${p.envio}${p.data?'  ('+p.data+')':''}`] : []),
      ...(p ? [`Pasta: ${p.raw}`] : []),
      `Gestor Mapeado: ${r.x ? r.x.row.nome+' — '+r.x.tab.nome : 'não vinculado'}     CNES: ${d.estabelecimentos.map(e=>e.cnes).join(', ')||'-'}`,

      `Gerado em: ${d.geracao||'-'}     Município: ${d.municipio||'-'}     Origem: ${d.origem||'-'}`,
      `Competência ativa no Gestor Mapeado: ${fmtComp(state.competencia)}     Versão SCNES vigente: ${cfg().versao}` ].forEach(l => { doc.text(l, 12, y); y += 4.6; });
    doc.autoTable({
      startY: y+2, margin:{left:12,right:12,top:28}, theme:'grid',
      head:[['#','Crítica','Gestor Mapeado / Parâmetro','Protocolo (.qrp)','Situação']],
      body: r.criticas.map(k => [k.n, k.nome, String(k.esperado), String(k.obtido), k.ok?'OK':'CRÍTICA']),
      styles:{fontSize:8.5, cellPadding:2, lineColor:[203,213,225], lineWidth:.15, textColor:[15,23,42]},

      didParseCell: c => { if (c.section==='body' && c.column.index===4){ c.cell.styles.textColor = c.cell.raw==='OK' ? colors.ok : colors.bad; } },

    if (!r.ok && y < H-40){ y += 6; doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(100,116,139);
      doc.text(doc.splitTextToSize('Após as correções, gerar nova exportação COMPLETA no SCNES (destino Município P. Gestão) e reenviar a base (.bck) com o protocolo (.qrp) pelo Transmissor DID.', W-24), 12, y); }
  });
  const n = doc.getNumberOfPages(), stamp = new Date().toLocaleString('pt-BR');
  for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(100,116,139);
    doc.text(`DID · Diretoria de Inteligência de Dados — SEMSA Manaus · emitido em ${stamp}`, 12, H-7); doc.text(`Página ${i} de ${n}`, W-12, H-7, {align:'right'}); }
  const f0 = files[0], nm = files.length===1 ? ((f0.pasta && f0.pasta.padrao) ? `${f0.pasta.distrito}_ID${f0.pasta.id}_${f0.pasta.envio==='FINAL'?'FINAL':'PREVIA'}_` : (f0.data.estabelecimentos[0]?.cnes || 'QRP')+'_') + qName(f0).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/gi,'_') : `LOTE_${files.length}_ENVIOS`;
  doc.save(`CRITICAS_QRP_${state.competencia}_${nm}.pdf`.replace(/_+\.pdf$/,'.pdf'));
  toast('PDF de críticas gerado');
}

/* ================= IMPORTAÇÃO (BCK) ================= */
const PASTA_IMP = 'PARA IMPORTAÇÃO';
let impSel = {};          // f.id -> true/false (marcação do operador)
let impRun = null;        // {st:'run'|'done', raiz, itens:[{f, nome, tam, st, msg, pct}], inicio, fim}
const fmtBytes = n => n==null ? '—' : n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(1)+' KB' : (n/1048576).toFixed(2)+' MB';
function bckDoEnvio(f){ const alvo = bckKey(f.data?.arquivo); return (f.bcks||[]).find(b => bckKey(b) === alvo) || null; }
function impCandidatos(){
  const val = qrpFiles.filter(f => !f.erro && f.porPasta && analisar(f).ok && bckDoEnvio(f));
  // envio mais recente validado por estabelecimento
  const last = {};
  val.forEach(f => { const k = f.matchId || estKey(qName(f)), o = f.pasta?.ord || '';
    if (!last[k] || o > (last[k].pasta?.ord || '')) last[k] = f; });
  const recentes = new Set(Object.values(last));
  return val.map(f => ({f, bck: bckDoEnvio(f), recente: recentes.has(f)}))
    .sort((a,b) => (a.f.pasta?.distrito||'ZZZ').localeCompare(b.f.pasta?.distrito||'ZZZ') || (+a.f.pasta?.id||1e9)-(+b.f.pasta?.id||1e9));
}
const impMarcado = c => impSel[c.f.id] ?? c.recente;
function renderImp(){
  const cands = impCandidatos(), rej = qrpFiles.filter(f => f.erro || !analisar(f).ok).length;
  const semPasta = qrpFiles.filter(f => !f.erro && !f.porPasta && analisar(f).ok).length;
  const sel = cands.filter(impMarcado), suporte = !!window.showDirectoryPicker;
  const tot = sel.reduce((a,c) => a + (c.f.bckSz?.[c.bck] || 0), 0);
  const ST_IMP = {wait:['muted','Aguardando'], copy:['warn','Copiando'], ver:['warn','Verificando'], ok:['ok','✔ Copiado e verificado'], same:['ok','↺ Já existia (idêntico)'], err:['bad','✖ Erro']};
  return `<div class="section">
    <div class="section-head"><div><h3>Importação (BCK) — Competência ${fmtComp(state.competencia)}</h3>
      <div class="sub">Gera a pasta “${PASTA_IMP}” dentro da pasta dos envios, apenas com cópias idênticas dos .bck dos IDs VALIDADOS</div></div></div>
    <div class="qparams">
      <div class="kpi main"><div class="l">Validados com .bck</div><div class="v">${cands.length}</div></div>
      <div class="kpi"><div class="l">Selecionados p/ importação</div><div class="v">${sel.length}</div></div>
      <div class="kpi"><div class="l">Tamanho total</div><div class="v sm">${fmtBytes(tot)}</div></div>
      <div class="kpi" style="border-color:#f9c6d5"><div class="l">Rejeitados (não copiados)</div><div class="v" style="color:#be123c">${rej}</div></div>
    </div>
    ${!suporte ? `<div class="apont"><h4>Navegador sem suporte</h4>A criação da pasta exige o <b>Google Chrome</b> ou o <b>Microsoft Edge</b> no computador, com o sistema aberto pelo endereço do GitHub Pages (https).</div>` : ''}
    ${!qrpFiles.length ? `<div class="empty" style="background:#fff;border:1px solid var(--line);border-radius:12px">Nenhum envio analisado ainda. Analise as pastas na aba <b>⇪ VALIDAR QRP</b> e volte aqui.</div>` : `
    ${semPasta ? `<div class="apont aviso"><h4>Atenção</h4>${semPasta} protocolo(s) validado(s) foram carregados como arquivo solto (sem pasta) e não têm .bck associado — não entram na importação.</div>` : ''}
    <div class="table-wrap" style="margin-top:6px"><table class="qt">
      <thead><tr><th style="width:34px"><input type="checkbox" id="impAll"${cands.length && cands.every(impMarcado)?' checked':''}></th><th>Distrito</th><th>ID</th><th>Estabelecimento</th><th>Envio</th><th>Arquivo .bck</th><th class="num">Tamanho</th><th>Situação</th></tr></thead>
      <tbody>${cands.map(c => { const p = c.f.pasta||{}, it = impRun?.itens.find(i => i.f===c.f);
        return `<tr><td><input type="checkbox" data-imp="${c.f.id}"${impMarcado(c)?' checked':''}${impRun?.st==='run'?' disabled':''}></td>
          <td>${p.padrao?`<span class="qdist">${esc(p.distrito)}</span>`:'—'}</td><td>${p.padrao?`<span class="qid">${esc(p.id)}</span>`:'—'}</td>
          <td><b>${esc(qName(c.f))}</b>${!c.recente?'<div class="qcount">há envio validado mais recente deste estabelecimento</div>':''}</td>
          <td>${p.padrao?`<span class="qenvio ${p.envio==='FINAL'?'final':'previa'}">${p.envio}</span>`:'—'}</td>
          <td style="font-family:ui-monospace,Consolas,monospace;font-size:11.5px">${esc(c.bck)}</td>
          <td class="num">${fmtBytes(c.f.bckSz?.[c.bck])}</td>
          <td id="imp-${c.f.id}">${it ? `<span class="pill ${ST_IMP[it.st][0]}">${ST_IMP[it.st][1]}${it.st==='copy'||it.st==='ver'?' '+(it.pct||0)+'%':''}</span>${it.msg?`<div class="qcount">${esc(it.msg)}</div>`:''}` : '<span class="pill muted">—</span>'}</td></tr>`; }).join('')
        || '<tr><td colspan="8" class="empty">Nenhum envio VALIDADO com arquivo .bck. Corrija os rejeitados e reanalise.</td></tr>'}</tbody>
    </table></div>
    <div class="qstage-foot" style="margin-top:16px">
      <div class="hint" style="max-width:720px">Ao clicar, selecione <b>a mesma pasta usada na análise</b> (ex.: <code>K:\\envios\\09.2026</code>) e autorize a edição. O sistema cria a subpasta <b>${PASTA_IMP}</b> e copia cada .bck byte a byte, mantendo nome, tipo e tamanho; em seguida compara a cópia com o original. Os arquivos originais não são alterados. Arquivos que já existam na pasta com conteúdo diferente <b>não</b> são sobrescritos.</div>
      <span class="sep"></span>
      ${impRun?.st==='done' ? `<button class="btn btn-ghost" id="impPdf">⬇ Relatório da importação (PDF)</button>` : ''}
      <button class="btn btn-success" id="impGo"${!suporte||!sel.length||impRun?.st==='run'?' disabled style="opacity:.5;cursor:not-allowed"':''}>${impRun?.st==='run'?'Copiando…':`⇩ Importação (BCK) — copiar ${sel.length} arquivo(s)`}</button>
    </div>
    ${impRun?.st==='done' ? (() => { const ok = impRun.itens.filter(i=>i.st==='ok').length, same = impRun.itens.filter(i=>i.st==='same').length, err = impRun.itens.filter(i=>i.st==='err').length;
      return `<div class="apont ${err?'':'good'}" style="margin-top:14px"><h4>${err?'Importação concluída com erros':'Importação concluída'}</h4>
        Pasta: <b>${esc(impRun.raiz)}\\${esc(impRun.pasta||PASTA_IMP)}</b> · ${ok} copiado(s) e verificado(s)${same?` · ${same} já existia(m) idêntico(s)`:''}${err?` · <b>${err} com erro</b> (ver coluna Situação)`:''}.</div>`; })() : ''}
    `}
  </div>`;
}
async function getSubdir(dir, nome){ try { return await dir.getDirectoryHandle(nome); } catch(_){ return null; } }
async function localizarPastaEnvio(raiz, f){
  const dirRel = f.chave.replace(/\/[^/]*$/,'').split('/').filter(Boolean);
  // caminho completo (ignorando o nome da raiz, se for o primeiro nível)
  let partes = dirRel[0] === raiz.name ? dirRel.slice(1) : dirRel, h = raiz;
  for (const p of partes){ h = await getSubdir(h, p); if (!h) break; }
  if (h && h !== raiz) return h;
  return await getSubdir(raiz, dirRel[dirRel.length-1]);   // pasta do envio direto dentro da selecionada
}
async function mesmosBytes(a, b, onPct){
  if (a.size !== b.size) return false;
  const STEP = 4 * 1048576;
  for (let o = 0; o < a.size; o += STEP){
    const [x, y] = await Promise.all([a.slice(o, o+STEP).arrayBuffer(), b.slice(o, o+STEP).arrayBuffer()]);
    const u = new Uint8Array(x), v = new Uint8Array(y);
    for (let i = 0; i < u.length; i++) if (u[i] !== v[i]) return false;
    onPct && onPct(Math.min(100, Math.round((o+STEP)/a.size*100)));
  }
  return true;
}
function impUpd(it){
  const el = document.getElementById('imp-'+it.f.id); if (!el) return;
  const map = {wait:['muted','Aguardando'], copy:['warn','Copiando'], ver:['warn','Verificando'], ok:['ok','✔ Copiado e verificado'], same:['ok','↺ Já existia (idêntico)'], err:['bad','✖ Erro']};
  el.innerHTML = `<span class="pill ${map[it.st][0]}">${map[it.st][1]}${it.st==='copy'||it.st==='ver'?' '+(it.pct||0)+'%':''}</span>${it.msg?`<div class="qcount">${esc(it.msg)}</div>`:''}`;
}
async function executarImportacao(){
  const sel = impCandidatos().filter(impMarcado);
  if (!sel.length) return;
  // nomes repetidos na seleção (mesmo .bck em dois envios)
  const nomes = {}; sel.forEach(c => (nomes[c.bck.toLowerCase()] = (nomes[c.bck.toLowerCase()]||0)+1));
  let raiz;
  try { raiz = await window.showDirectoryPicker({id:'gm-envios', mode:'readwrite'}); }
  catch(e){ if (e.name !== 'AbortError') toast('Não foi possível abrir a pasta: '+e.message); return; }
  if (await raiz.queryPermission({mode:'readwrite'}) !== 'granted' && await raiz.requestPermission({mode:'readwrite'}) !== 'granted'){ toast('Permissão de gravação negada'); return; }
  // confere se é a pasta da análise: ao menos uma pasta de envio precisa existir nela
  const achou = []; for (const c of sel) achou.push(await localizarPastaEnvio(raiz, c.f));
  if (!achou.some(Boolean)){ toast(`A pasta "${raiz.name}" não contém as pastas dos envios analisados. Selecione a mesma pasta da análise.`); return; }
  impRun = {st:'run', raiz: raiz.name, inicio: new Date(), itens: sel.map((c,i) => ({f:c.f, nome:c.bck, tam:c.f.bckSz?.[c.bck], st:'wait', pct:0, dir:achou[i]}))};
  render();
  let destino;
  const criar = async nome => {   // cria a subpasta e confirma que é de fato uma pasta nova dentro da selecionada
    const d = await raiz.getDirectoryHandle(nome, {create:true});
    const rel = await raiz.resolve(d);
    if (await d.isSameEntry(raiz) || !rel || rel.length !== 1) throw new Error('subpasta não confirmada');
    return d;
  };
  try { destino = await criar(PASTA_IMP); impRun.pasta = PASTA_IMP; }
  catch(e1){
    try { destino = await criar('PARA IMPORTACAO'); impRun.pasta = 'PARA IMPORTACAO'; toast('O sistema de arquivos não aceitou acentos: pasta criada como PARA IMPORTACAO'); }
    catch(e){ impRun.itens.forEach(it => { it.st='err'; it.msg='Não foi possível criar a pasta '+PASTA_IMP+': '+e.message; }); impRun.st='done'; render(); return; }
  }
  for (const it of impRun.itens){
    try {
      if (nomes[it.nome.toLowerCase()] > 1) throw new Error('Mesmo nome de .bck em mais de um envio selecionado — desmarque um deles.');
      if (!it.dir) throw new Error('Pasta do envio não encontrada na pasta selecionada.');
      const src = await (await it.dir.getFileHandle(it.nome)).getFile();
      it.tam = src.size;
      let existente = null; try { existente = await (await destino.getFileHandle(it.nome)).getFile(); } catch(_){}
      if (existente){
        it.st='ver'; impUpd(it);
        if (await mesmosBytes(src, existente, p => { it.pct=p; impUpd(it); })){ it.st='same'; it.msg=''; impUpd(it); continue; }
        throw new Error('Já existe um arquivo com este nome em '+PASTA_IMP+' com conteúdo diferente — não foi sobrescrito.');
      }
      it.st='copy'; it.pct=0; impUpd(it);
      const fh = await destino.getFileHandle(it.nome, {create:true});
      const w = await fh.createWritable({keepExistingData:false});
      try {
        const STEP = 4 * 1048576;
        for (let o = 0; o < src.size; o += STEP){
          await w.write(await src.slice(o, o+STEP).arrayBuffer());
          it.pct = Math.min(100, Math.round((o+STEP)/src.size*100)); impUpd(it);
        }
        if (src.size === 0) await w.write(new Uint8Array(0));
        await w.close();
      } catch(e){ try { await w.abort(); } catch(_){} throw e; }
      it.st='ver'; it.pct=0; impUpd(it);
      const copia = await fh.getFile();
      if (!(await mesmosBytes(src, copia, p => { it.pct=p; impUpd(it); }))){
        try { await destino.removeEntry(it.nome); } catch(_){}
        throw new Error('A cópia não ficou idêntica ao original e foi descartada. Tente novamente.');
      }
      it.st='ok'; it.msg = `${fmtBytes(copia.size)} · conferido byte a byte`; impUpd(it);
    } catch(e){ it.st='err'; it.msg = e.message; impUpd(it); }
  }
  impRun.st='done'; impRun.fim = new Date(); render();
  const err = impRun.itens.filter(i=>i.st==='err').length;
  toast(err ? `Importação concluída com ${err} erro(s)` : `Pasta ${impRun.pasta||PASTA_IMP} gerada com sucesso`);
}
function impPDF(){
  if (!window.jspdf || !impRun) return;
  const { jsPDF } = window.jspdf, doc = new jsPDF({unit:'mm', format:'a4', orientation:'landscape'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const header = () => { doc.setFillColor(7,46,80); doc.rect(0,0,W,20,'F'); doc.setFillColor(3,75,117); doc.rect(W/2,0,W/2,20,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('RELATÓRIO DE IMPORTAÇÃO (BCK)', 12, 9);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(165,208,245); doc.text(`GESTOR MAPEADO · TRANSMISSOR DID · COMPETÊNCIA ${fmtComp(state.competencia)}`, 12, 15); };
  header();
  const ok = impRun.itens.filter(i=>i.st==='ok').length, same = impRun.itens.filter(i=>i.st==='same').length, err = impRun.itens.filter(i=>i.st==='err').length;
  doc.setTextColor(15,23,42); doc.setFontSize(9.5);
  doc.text(`Pasta de destino: ${impRun.raiz}\\${impRun.pasta||PASTA_IMP}`, 12, 28);
  doc.text(`Início: ${impRun.inicio.toLocaleString('pt-BR')}   Término: ${impRun.fim.toLocaleString('pt-BR')}   Copiados e verificados: ${ok}   Já existentes (idênticos): ${same}   Erros: ${err}`, 12, 33.5);
  const lbl = {ok:'Copiado e verificado', same:'Já existia (idêntico)', err:'Erro', wait:'Não processado', copy:'Interrompido', ver:'Interrompido'};
  doc.autoTable({ startY:38, margin:{left:10,right:10,top:26}, theme:'grid',
    head:[['Distrito','ID','Estabelecimento','Envio','Arquivo .bck','Tamanho (bytes)','Situação','Observação']],
    body: impRun.itens.map(i => [i.f.pasta?.distrito||'-', i.f.pasta?.id||'-', qName(i.f), i.f.pasta?.envio||'-', i.nome, i.tam!=null?i.tam.toLocaleString('pt-BR'):'-', lbl[i.st], i.msg||'']),
    styles:{fontSize:7.5, cellPadding:1.6, lineColor:[203,213,225], lineWidth:.15, textColor:[15,23,42]}, headStyles:{fillColor:[3,75,117], textColor:255},
    columnStyles:{4:{cellWidth:62}, 5:{halign:'right'}},
    didParseCell: c => { if (c.section==='body' && c.column.index===6){ c.cell.styles.fontStyle='bold'; c.cell.styles.textColor = c.cell.raw==='Erro' ? [224,36,94] : [16,185,129]; } },
    didDrawPage: header });
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(7); doc.setTextColor(100,116,139); doc.text('DID · Diretoria de Inteligência de Dados — SEMSA Manaus · cópias conferidas byte a byte com os originais', 10, H-6); doc.text(`Página ${i} de ${n}`, W-10, H-6, {align:'right'}); }
  doc.save(`IMPORTACAO_BCK_${state.competencia}.pdf`);
}
document.addEventListener('change', e => {
  const cb = e.target.closest && e.target.closest('[data-imp]');
  if (cb){ impSel[cb.dataset.imp] = cb.checked; render(); return; }
  if (e.target.id==='impAll'){ impCandidatos().forEach(c => impSel[c.f.id] = e.target.checked); render(); }
});
document.addEventListener('click', e => {
  if (e.target.id==='impGo'){ executarImportacao(); }
  if (e.target.id==='impPdf'){ impPDF(); }
});

/* ================= INÍCIO ================= */
state = load();
try { current = localStorage.getItem(KEY+'.tab'); } catch(_){}
if (!TABS.some(t=>t.id===current)) current = 'leste';
render();
$('#status').textContent = 'Salvamento automático';
</script>
